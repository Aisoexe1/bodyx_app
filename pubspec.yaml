name: bodyx_app
description: "BodyX — premium dark-neon health & fitness tracker with an interactive body-metrics visualizer."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  health: ^13.3.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/logo.png
    - assets/body3d/body.html
    - assets/body3d/three.min.js
    - assets/body3d/OrbitControls.js

flutter_launcher_icons:
  image_path: "assets/icon/icon_source.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
