# Render Blueprint — deploys stfdv's MongoDB backend with one click.
# In Render: New → Blueprint → select this repo → Apply.
# MONGO_URI must be set by hand in the Render dashboard (Atlas connection
# string) — it's a secret, so it is deliberately not in this file.
services:
  - type: web
    name: bodyx-api
    runtime: docker
    rootDir: bodyx_backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGO_DB_NAME
        value: bodyx
      - key: MONGO_URI
        sync: false
