# Render Blueprint — deploys the BodyX backend with one click.
# In Render: New → Blueprint → select this repo → Apply.
services:
  - type: web
    name: bodyx-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Free tier has no persistent disk: the SQLite file resets on each
      # deploy/restart. Fine for first testing; swap to MongoDB (stfdv's
      # cluster) or a paid disk before real users.
      - key: BODYX_DB
        value: /tmp/bodyx.db
